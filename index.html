<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Sizes - OpenStreetMap</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏙</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <a id="repoLink" href="https://github.com/fsvbach/city-sizes" target="_blank" rel="noopener" aria-label="Source on GitHub">
    <img src="https://cdn.jsdelivr.net/npm/@primer/octicons@19/build/svg/mark-github-24.svg" width="20" height="20" alt="" />
  </a>
  <h1><b>City</b> Sizes</h1>
  <div class="legend-modes" role="group" aria-label="Legend">
    <button type="button" data-mode="off" aria-pressed="false">Hide legend</button>
    <button type="button" data-mode="names" aria-pressed="false">Show city names only</button>
    <button type="button" data-mode="full" aria-pressed="true" class="is-active">Show full legend</button>
  </div>
  <span id="status">Loading data...</span>
  <span class="header-actions">
    <button type="button" id="copyLinkBtn" title="Copy a link to this view — with “Show names only” active that's a quiz">
      <img src="https://cdn.jsdelivr.net/npm/@tabler/icons@3/icons/outline/link.svg" width="15" height="15" alt="" />
      <span>Copy link</span>
    </button>
    <button type="button" id="saveBtn" title="Export this comparison as a JSON file">Save</button>
    <button type="button" id="loadBtn" title="Import a comparison from a JSON file">Load</button>
  </span>
  <input id="importFile" type="file" accept=".json,application/json" style="display:none" />
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script>
  // Local development only: load the gitignored js/config.local.js with the localhost CARTO key.
  // It stays out of the repo because a localhost-restricted key would work for anyone running the page locally.
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
    document.write('<script src="js/config.local.js"><\/script>');
  }
</script>
<script src="js/app.js"></script>

</body>
</html>
